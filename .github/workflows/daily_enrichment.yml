name: Daily enrichment pipelines

# Esegue quotidianamente le pipeline di enrichment per ogni categoria
# documentale del repository. Scarica i dataset e report ORIGINALI dalle fonti
# ufficiali, rigenera gli estratti processati e committa le modifiche sul
# ramo principale.
#
# Trigger: schedulato ogni giorno alle 04:00 UTC (06:00 Europe/Rome d'estate)
# + workflow_dispatch per run manuali (con scelta categoria opzionale).

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: "Categorie da eseguire (separate da spazio, vuoto = tutte)"
        required: false
        default: ""
      skip:
        description: "Categorie da saltare (separate da spazio)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    name: Enrichment ${{ matrix.category }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        category:
          - orphadata
          - ania
          - aifa
          - gimbe
          - uniamo
          - osservatorio_salute
          - enpam
          - finanza
          - ministero_salute
          - istat
          - ons
          - oasi_bocconi
          - internazionale
          - iss
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skip filter
        id: skip
        env:
          SKIP_INPUT: ${{ github.event.inputs.skip }}
          ONLY_INPUT: ${{ github.event.inputs.only }}
          CAT: ${{ matrix.category }}
        run: |
          set -e
          run=true
          if [ -n "${ONLY_INPUT}" ]; then
            case " ${ONLY_INPUT} " in *" ${CAT} "*) run=true ;; *) run=false ;; esac
          fi
          if [ -n "${SKIP_INPUT}" ]; then
            case " ${SKIP_INPUT} " in *" ${CAT} "*) run=false ;; esac
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Run enrichment pipeline
        if: steps.skip.outputs.run == 'true'
        run: python scripts/run_daily_enrichment.py --only ${{ matrix.category }}

      - name: Upload report artifact
        if: always() && steps.skip.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-${{ matrix.category }}-${{ github.run_id }}
          path: logs/enrichment_*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit downloaded originals
        if: steps.skip.outputs.run == 'true'
        run: |
          git config user.name "info-mib-enrichment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datasets/raw/${{ matrix.category }} datasets/processed 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica per ${{ matrix.category }}"
          else
            git commit -m "chore(enrichment): daily update ${{ matrix.category }} [skip ci]"
            for i in 1 2 3 4; do
              if git push; then break; fi
              sleep $((2 ** i))
            done
          fi

  summary:
    name: Consolidate run
    runs-on: ubuntu-latest
    needs: enrich
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: enrichment-*
          merge-multiple: true
      - name: Print summary
        shell: python
        run: |
          import glob, json, os
          lines = [
              "## Daily enrichment summary",
              "",
              "| Category | Downloaded | Unchanged | Failed |",
              "|---|---:|---:|---:|",
          ]
          for path in sorted(glob.glob("reports/enrichment_*.json")):
              try:
                  data = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  lines.append(f"| (error reading {path}: {e}) | - | - | - |")
                  continue
              for r in data.get("reports", []):
                  lines.append(
                      f"| {r['category']} | {r['downloaded']} | {r['unchanged']} | {r['failed']} |"
                  )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
